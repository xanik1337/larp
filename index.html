<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Updates title in tab/app switcher -->
  <title>Phantom</title>

  <!-- Adds Phantom ghost icon to browser tab & app switcher -->
  <link rel="icon" type="image/png" href="https://phantom.app/favicon.ico">
  <link rel="apple-touch-icon" href="https://phantom.app/apple-touch-icon.png">
  <!-- Google Font Inter for precise geometric rendering -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 16px;
    }

    .app-container {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* Editable style cue */
    [contenteditable="true"] {
      outline: none;
      cursor: pointer;
      border-radius: 4px;
      transition: background-color 0.2s;
    }

    [contenteditable="true"]:focus {
      background-color: rgba(255, 255, 255, 0.12);
    }

    /* Top Navigation Container */
    .top-nav-container {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 24px;
      margin-top: 8px;
    }

    .profile-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background-color: #1c1c1e;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      overflow: hidden;
      cursor: pointer;
    }

    .profile-btn img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .nav-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      flex: 1;
    }
    .nav-bar::-webkit-scrollbar {
      display: none;
    }

    .nav-btn {
      background-color: #1c1c1e;
      color: #8e8e93;
      padding: 10px 20px;
      border-radius: 24px;
      font-size: 15px;
      font-weight: 500;
      letter-spacing: -0.2px;
      white-space: nowrap;
      border: none;
      cursor: pointer;
    }

    .nav-btn.active {
      background-color: #ab9ff2;
      color: #000000;
      font-weight: 500;
    }

    /* Profile Header */
    .profile-header {
      display: flex;
      align-items: center;
      gap: 4px;
      color: #8e8e93;
      font-size: 17px;
      font-weight: 500;
      letter-spacing: -0.3px;
      margin-bottom: 8px;
    }

    .profile-header span {
      color: #e5e5ea;
    }

    /* Main Balance Section - Non-bold exact Phantom font */
    .balance-container {
      margin-bottom: 24px;
    }

    .balance-amount {
      font-size: 46px;
      font-weight: 500; /* Medium, NOT Bold */
      letter-spacing: -1.2px;
      line-height: 1.1;
      margin-bottom: 10px;
      display: inline-block;
      color: #ffffff;
    }

    .balance-change {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .change-value {
      color: #30d158;
      font-size: 15px;
      font-weight: 500;
      letter-spacing: -0.2px;
    }

    .change-badge {
      background-color: #12301b;
      color: #30d158;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: -0.1px;
    }

    /* Cash Card */
    .cash-card {
      background-color: #121212;
      border-radius: 20px;
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
    }

    .cash-info {
      display: flex;
      align-items: center;
      gap: 14px;
      font-weight: 500;
      font-size: 17px;
      letter-spacing: -0.3px;
      color: #ffffff;
    }

    .cash-icon-wrapper {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background-color: #2c2c2e;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .cash-icon-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .cash-amount {
      font-size: 17px;
      font-weight: 500;
      letter-spacing: -0.3px;
      color: #ffffff;
    }

    /* Section Header */
    .section-title {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.5px;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 4px;
      color: #ffffff;
    }

    /* Tokens List */
    .token-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 90px;
    }

    .token-card {
      background-color: #121212;
      border-radius: 20px;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .token-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .token-icon {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      object-fit: cover;
    }

    .token-details {
      display: flex;
      flex-direction: column;
    }

    .token-name-row {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .token-name {
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -0.3px;
      color: #ffffff;
    }

    .token-sub {
      font-size: 14px;
      color: #8e8e93;
      font-weight: 400;
      letter-spacing: -0.2px;
      margin-top: 3px;
    }

    .token-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }

    .token-value {
      font-size: 17px;
      font-weight: 500;
      letter-spacing: -0.3px;
      color: #ffffff;
    }

    .token-change {
      font-size: 14px;
      margin-top: 3px;
      font-weight: 500;
      letter-spacing: -0.2px;
    }

    .positive {
      color: #30d158;
    }

    /* Bottom Fixed Action Bar */
    .bottom-bar {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 32px);
      max-width: 420px;
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .search-input {
      flex: 1;
      background-color: #121212;
      border-radius: 28px;
      height: 52px;
      display: flex;
      align-items: center;
      padding: 0 18px;
      gap: 10px;
      color: #8e8e93;
      font-size: 16px;
      font-weight: 400;
      border: 1px solid #1c1c1e;
    }

    .add-btn {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background-color: #ab9ff2;
      color: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      font-weight: 400;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Top Navigation Container -->
    <div class="top-nav-container">
      <div class="profile-btn">
        <img src="IMG_5393.jpeg" alt="Profile">
      </div>
      <div class="nav-bar">
        <button class="nav-btn active">Home</button>
        <button class="nav-btn">Trade</button>
        <button class="nav-btn">Predict</button>
        <button class="nav-btn">Explore</button>
      </div>
    </div>

    <!-- Profile Header -->
    <div class="profile-header">
      <span contenteditable="true">hhighestboy</span> ⌄
    </div>

    <!-- Balance Section (Clean non-bold font style) -->
    <div class="balance-container">
      <div class="balance-amount" id="total-balance">$125,869.61</div>
      <div class="balance-change">
        <span class="change-value" id="total-change-val">+$2,842.15</span>
        <span class="change-badge" id="total-change-pct">+2.31%</span>
      </div>
    </div>

    <!-- Cash Card -->
    <div class="cash-card">
      <div class="cash-info">
        <div class="cash-icon-wrapper">
          <img class="cash-icon-img" src="cash.png" alt="Cash Icon" onerror="this.onerror=null; this.parentNode.innerHTML='<svg width=\'18\' height=\'18\' viewBox=\'0 0 24 24\' fill=\'none\' stroke=\'%238e8e93\' stroke-width=\'2\' stroke-linecap=\'round\' stroke-linejoin=\'round\'><rect x=\'2\' y=\'6\' width=\'20\' height=\'12\' rx=\'2\'/><circle cx=\'12\' cy=\'12\' r=\'2\'/></svg>';">
        </div>
        <span>Cash</span>
      </div>
      <div class="cash-amount balance-item" contenteditable="true">$0.00</div>
    </div>

    <!-- Section Title -->
    <div class="section-title">
      Tokens ›
    </div>

    <!-- Token List -->
    <div class="token-list">
      <!-- Solana -->
      <div class="token-card">
        <div class="token-left">
          <img class="token-icon" src="IMG_6994.png" alt="Solana">
          <div class="token-details">
            <div class="token-name-row">
              <span class="token-name">Solana</span>
            </div>
            <span class="token-sub" contenteditable="true">469.71 SOL</span>
          </div>
        </div>
        <div class="token-right">
          <span class="token-value balance-item" contenteditable="true">$35,322.41</span>
          <span class="token-change positive change-item" contenteditable="true">+$412.30</span>
        </div>
      </div>

      <!-- Bitcoin -->
      <div class="token-card">
        <div class="token-left">
          <img class="token-icon" src="IMG_6995.png" alt="Bitcoin">
          <div class="token-details">
            <div class="token-name-row">
              <span class="token-name">Bitcoin</span>
            </div>
            <span class="token-sub" contenteditable="true">0.5539 BTC</span>
          </div>
        </div>
        <div class="token-right">
          <span class="token-value balance-item" contenteditable="true">$34,843.77</span>
          <span class="token-change positive change-item" contenteditable="true">+$324.15</span>
        </div>
      </div>

      <!-- Ethereum -->
      <div class="token-card">
        <div class="token-left">
          <img class="token-icon" src="IMG_6996.webp" alt="Ethereum">
          <div class="token-details">
            <div class="token-name-row">
              <span class="token-name">Ethereum</span>
            </div>
            <span class="token-sub" contenteditable="true">16.0395 ETH</span>
          </div>
        </div>
        <div class="token-right">
          <span class="token-value balance-item" contenteditable="true">$30,124.91</span>
          <span class="token-change positive change-item" contenteditable="true">+$263.20</span>
        </div>
      </div>

      <!-- JeanPhil -->
      <div class="token-card">
        <div class="token-left">
          <img class="token-icon" src="IMG_6998.png" alt="JeanPhil">
          <div class="token-details">
            <div class="token-name-row">
              <span class="token-name">JeanPhil</span>
            </div>
            <span class="token-sub" contenteditable="true">25,578.52 JEANPHIL</span>
          </div>
        </div>
        <div class="token-right">
          <span class="token-value balance-item" contenteditable="true">$25,578.52</span>
          <span class="token-change positive change-item" contenteditable="true">+$1,842.50</span>
        </div>
      </div>
    </div>

    <!-- Bottom Bar -->
    <div class="bottom-bar">
      <div class="search-input">
        🔍 <span>Search Phantom</span>
      </div>
      <button class="add-btn">+</button>
    </div>
  </div>

  <script>
    function updateDashboardTotals() {
      // Calculate Total Balance
      const balanceItems = document.querySelectorAll('.balance-item');
      let totalBalance = 0;

      balanceItems.forEach(item => {
        const cleanValue = item.textContent.replace(/[^0-9.-]+/g, "");
        totalBalance += parseFloat(cleanValue) || 0;
      });

      document.getElementById('total-balance').textContent = '$' + totalBalance.toLocaleString('en-US', {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      });

      // Calculate Total Daily Change Value & Percentage
      const changeItems = document.querySelectorAll('.change-item');
      let totalChange = 0;

      changeItems.forEach(item => {
        const cleanValue = item.textContent.replace(/[^0-9.-]+/g, "");
        totalChange += parseFloat(cleanValue) || 0;
      });

      const changePct = totalBalance > 0 ? (totalChange / (totalBalance - totalChange)) * 100 : 0;

      document.getElementById('total-change-val').textContent = '+$' + totalChange.toLocaleString('en-US', {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      });

      document.getElementById('total-change-pct').textContent = '+' + changePct.toFixed(2) + '%';
    }

    // Initial calculation
    updateDashboardTotals();

    // Recalculate on any edit
    document.querySelectorAll('.balance-item, .change-item').forEach(item => {
      item.addEventListener('input', updateDashboardTotals);
    });
  </script>

</body>
</html>
