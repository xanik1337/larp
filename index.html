<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prism Crypto Dashboard</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "SF Pro", "Helvetica Neue", Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 24px 16px;
    }

    .app-container {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* Editable style cue */
    [contenteditable="true"] {
      outline: none;
      cursor: pointer;
      border-radius: 4px;
      transition: background-color 0.2s;
    }

    [contenteditable="true"]:focus {
      background-color: rgba(255, 255, 255, 0.15);
      box-shadow: 0 0 0 2px rgba(191, 163, 255, 0.5);
    }

    /* Top Bar with Profile Icon & Nav Buttons */
    .top-nav-container {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .profile-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background-color: #1c1c1e;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      overflow: hidden;
      cursor: pointer;
    }

    .profile-btn img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .nav-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      flex: 1;
    }
    .nav-bar::-webkit-scrollbar {
      display: none;
    }

    .nav-btn {
      background-color: #1c1c1e;
      color: #8e8e93;
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.2px;
      white-space: nowrap;
      border: none;
      cursor: pointer;
    }

    .nav-btn.active {
      background-color: #bfa3ff;
      color: #000000;
    }

    /* Header Profile Name */
    .profile-header {
      display: flex;
      align-items: center;
      gap: 4px;
      color: #8e8e93;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.3px;
      margin-bottom: 8px;
    }

    .profile-header span {
      color: #ffffff;
    }

    /* Balance Section */
    .balance-container {
      margin-bottom: 20px;
    }

    .balance-amount {
      font-size: 48px;
      font-weight: 800;
      letter-spacing: -1.2px;
      line-height: 1.1;
      margin-bottom: 8px;
      display: inline-block;
    }

    .balance-change {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .change-value {
      color: #30d158;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.2px;
    }

    .change-badge {
      background-color: rgba(48, 209, 88, 0.2);
      color: #30d158;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: -0.1px;
    }

    /* Cash Card */
    .cash-card {
      background-color: #121212;
      border-radius: 18px;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .cash-info {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 600;
      font-size: 16px;
      letter-spacing: -0.3px;
    }

    /* Cash Icon Styles */
    .cash-icon-wrapper {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background-color: #1c1c1e;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .cash-icon-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .cash-amount {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.3px;
      color: #8e8e93;
    }

    /* Section Header */
    .section-title {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.4px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* Tokens List */
    .token-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 80px;
    }

    .token-card {
      background-color: #121212;
      border-radius: 18px;
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .token-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .token-icon {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      object-fit: cover;
    }

    .token-details {
      display: flex;
      flex-direction: column;
    }

    .token-name-row {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .token-name {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .verified-badge {
      width: 14px;
      height: 14px;
      background-color: #8b5cf6;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-size: 9px;
      font-weight: bold;
    }

    .token-sub {
      font-size: 13px;
      color: #8e8e93;
      font-weight: 500;
      letter-spacing: -0.2px;
      margin-top: 2px;
    }

    .token-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }

    .token-value {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .token-change {
      font-size: 13px;
      margin-top: 2px;
      font-weight: 600;
      letter-spacing: -0.2px;
    }

    .positive {
      color: #30d158;
    }

    /* Bottom Action Bar */
    .bottom-bar {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 32px);
      max-width: 440px;
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .search-input {
      flex: 1;
      background-color: #121212;
      border-radius: 25px;
      height: 48px;
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 10px;
      color: #8e8e93;
      font-size: 15px;
      font-weight: 500;
      border: 1px solid #1c1c1e;
    }

    .add-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background-color: #bfa3ff;
      color: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Top Navigation Container with Profile Picture -->
    <div class="top-nav-container">
      <div class="profile-btn">
        <img src="IMG_5393.jpeg" alt="Profile">
      </div>
      <div class="nav-bar">
        <button class="nav-btn active">Home</button>
        <button class="nav-btn">Trade</button>
        <button class="nav-btn">Predict</button>
        <button class="nav-btn">Explore</button>
      </div>
    </div>

    <!-- Profile Header -->
    <div class="profile-header">
      <span contenteditable="true">hhighestboy</span> ⌄
    </div>

    <!-- Balance Section (Calculated dynamically) -->
    <div class="balance-container">
      <div class="balance-amount" id="total-balance">$125,869.61</div>
      <div class="balance-change">
        <span class="change-value" id="total-change-val">+$2,842.15</span>
        <span class="change-badge" id="total-change-pct">+2.31%</span>
      </div>
    </div>

    <!-- Cash Card with Image Icon (plus SVG Fallback) -->
    <div class="cash-card">
      <div class="cash-info">
        <div class="cash-icon-wrapper">
          <img class="cash-icon-img" src="cash.png" alt="Cash Icon" onerror="this.onerror=null; this.parentNode.innerHTML='<svg width=\'16\' height=\'16\' viewBox=\'0 0 24 24\' fill=\'none\' stroke=\'%2330d158\' stroke-width=\'2.5\' stroke-linecap=\'round\' stroke-linejoin=\'round\'><line x1=\'12\' y1=\'1\' x2=\'12\' y2=\'23\'/><path d=\'M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6\'/></svg>';">
        </div>
        <span>Cash</span>
      </div>
      <div class="cash-amount balance-item" contenteditable="true">$0.00</div>
    </div>

    <!-- Section Title -->
    <div class="section-title">
      Tokens ›
    </div>

    <!-- Token List -->
    <div class="token-list">
      <!-- Solana -->
      <div class="token-card">
        <div class="token-left">
          <img class="token-icon" src="picture.png" alt="Solana">
          <div class="token-details">
            <div class="token-name-row">
              <span class="token-name">Solana</span>
              <span class="verified-badge">✓</span>
            </div>
            <span class="token-sub" contenteditable="true">469.71 SOL</span>
          </div>
        </div>
        <div class="token-right">
          <span class="token-value balance-item" contenteditable="true">$35,322.41</span>
          <span class="token-change positive change-item" contenteditable="true">+$412.30</span>
        </div>
      </div>

      <!-- Bitcoin -->
      <div class="token-card">
        <div class="token-left">
          <img class="token-icon" src="picture.png" alt="Bitcoin">
          <div class="token-details">
            <div class="token-name-row">
              <span class="token-name">Bitcoin</span>
              <span class="verified-badge">✓</span>
            </div>
            <span class="token-sub" contenteditable="true">0.5539 BTC</span>
          </div>
        </div>
        <div class="token-right">
          <span class="token-value balance-item" contenteditable="true">$34,843.77</span>
          <span class="token-change positive change-item" contenteditable="true">+$324.15</span>
        </div>
      </div>

      <!-- Ethereum -->
      <div class="token-card">
        <div class="token-left">
          <img class="token-icon" src="picture.png" alt="Ethereum">
          <div class="token-details">
            <div class="token-name-row">
              <span class="token-name">Ethereum</span>
              <span class="verified-badge">✓</span>
            </div>
            <span class="token-sub" contenteditable="true">16.0395 ETH</span>
          </div>
        </div>
        <div class="token-right">
          <span class="token-value balance-item" contenteditable="true">$30,124.91</span>
          <span class="token-change positive change-item" contenteditable="true">+$263.20</span>
        </div>
      </div>

      <!-- JeanPhil -->
      <div class="token-card">
        <div class="token-left">
          <img class="token-icon" src="picture.png" alt="JeanPhil">
          <div class="token-details">
            <div class="token-name-row">
              <span class="token-name">JeanPhil</span>
            </div>
            <span class="token-sub" contenteditable="true">25,578.52 JEANPHIL</span>
          </div>
        </div>
        <div class="token-right">
          <span class="token-value balance-item" contenteditable="true">$25,578.52</span>
          <span class="token-change positive change-item" contenteditable="true">+$1,842.50</span>
        </div>
      </div>
    </div>

    <!-- Bottom Bar -->
    <div class="bottom-bar">
      <div class="search-input">
        🔍 <span>Search Prism</span>
      </div>
      <button class="add-btn">+</button>
    </div>
  </div>

  <script>
    function updateDashboardTotals() {
      // Calculate Total Balance
      const balanceItems = document.querySelectorAll('.balance-item');
      let totalBalance = 0;

      balanceItems.forEach(item => {
        const cleanValue = item.textContent.replace(/[^0-9.-]+/g, "");
        totalBalance += parseFloat(cleanValue) || 0;
      });

      document.getElementById('total-balance').textContent = '$' + totalBalance.toLocaleString('en-US', {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      });

      // Calculate Total Daily Change Value & Percentage
      const changeItems = document.querySelectorAll('.change-item');
      let totalChange = 0;

      changeItems.forEach(item => {
        const cleanValue = item.textContent.replace(/[^0-9.-]+/g, "");
        totalChange += parseFloat(cleanValue) || 0;
      });

      const changePct = totalBalance > 0 ? (totalChange / (totalBalance - totalChange)) * 100 : 0;

      document.getElementById('total-change-val').textContent = '+$' + totalChange.toLocaleString('en-US', {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      });

      document.getElementById('total-change-pct').textContent = '+' + changePct.toFixed(2) + '%';
    }

    // Initial calculation
    updateDashboardTotals();

    // Recalculate on any edit
    document.querySelectorAll('.balance-item, .change-item').forEach(item => {
      item.addEventListener('input', updateDashboardTotals);
    });
  </script>

</body>
</html>
